    <title>Register</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <header>
        <section class="top-header">
            <div class="logo">
                <img src="https://images.squarespace-cdn.com/content/v1/68e4383b9e6e4820b34c6198/3bce020b-6f0b-4337-b320-0bf283e0abce/StudentHub+Logo.jpg?format=1500w" alt="student_hub_logo">
            </div>
            <div class="title">
                <h1>StudentHub</h1>
            </div>
        </section>
        <section class="bottom-header">
            <nav>
                <ul>
                    <li><a href="Home.html">Home</a></li>

                </ul>
            </nav>
        </section>
    </header>

    <main class="registration-main">
        <section class="registration-container">
            <h2>StudentHub Portal Registration</h2>
            <form>
            <h3>Registration Details</h3>
                <input type="text" placeholder="Full Name" required>
                <input type="email" placeholder="Email" required>
                <input type="text" placeholder="StudentID" required>
                <input type="text" placeholder="Department" required>
                <input type="password" placeholder="Password" required>
                <input type="password" placeholder="Confirm Password" required>
                <div class="registration_buttons">
                    <button type="submit">Register</button>
                    <button type="Cancel">Cancel</button>
                </div>
            <form>
        </section>
    </main>

    <footer>

    </footer>
