<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Profile page of the studenthub portal">
    <title>Profile</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <header class="profile-header">
        <div class="user-logo">
            <img src="https://images.squarespace-cdn.com/content/v1/68e4383b9e6e4820b34c6198/3bce020b-6f0b-4337-b320-0bf283e0abce/StudentHub+Logo.jpg?format=1500w" alt="StudentHub Logo">
        </div>
        <div class="search-info">
            <input type="search" placeholder="Search...">
        </div>
        <div class="user-menu">
            <span class="notification">🔔</span>
            <div class="user-details">
                <p>Prey Patel</p>
                <small>2XDCEXXX</small>
            </div>
            <img src="" class="mini-profile" alt="Profile">
            <span class="dropdown">▼</span>
        </div>
    </header>
    <main class="profile-main">
        <h2>Student Profile</h2>
        <section class="profile-picture-section">
            <div class="profile-picture">
                <img src="" alt="Profile Picture" class="profile-img">
                <button class="change-pic">Change Picture</button>
            </div>
        </section>
        <section class="profile-details">
            <form>
                <div class="profile-details-element">
                    <label>Name:</label>
                    <input type="text" value="Prey Patel">
                </div>
                <div class="profile-details-element">
                    <label>Email:</label>
                    <input type="email" value="preypatel@example.com">
                </div>
                <div class="profile-details-element">
                    <label>Student ID:</label>
                    <input type="text" value="2XDCEXXX">
                </div>
                <div class="profile-details-element">
                    <label>Department</label>
                    <input type="text" value="Computer Engineering">
                </div>
                <div class="profile-details-element">
                    <label>Semester</label> 
                    <input type="number" value="3">
                </div>
                <div class="profile-buttons">
                    <button type="button">Edit</button>
                    <button type="submit">Save</button>
                </div>
            </form>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 StudentHub. All rights reserved.</p>
    </footer>
