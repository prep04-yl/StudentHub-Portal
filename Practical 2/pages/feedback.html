<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Feedback for the studenthub portal">
    <title>Feedback</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <header>
        <section class="top-header">
            <div class="logo">
                <img src="https://images.squarespace-cdn.com/content/v1/68e4383b9e6e4820b34c6198/3bce020b-6f0b-4337-b320-0bf283e0abce/StudentHub+Logo.jpg?format=1500w" alt="student_hub_logo">
            </div>
            <div class="title">
                <h1>StudentHub</h1>
            </div>
        </section>
        <section class="bottom-header">
            <nav>
                <ul>
                    <li><a href="Home.html">Home</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="events.html">Events</a></li>
                    <li><a href="faq.html">FAQ</a></li>
                    <li><a href="contact.html">Contact</a></li>
                    <li><a class="active" href="feedback.html">Feedback</a></li>
                    <li><a href="registration.html">Register</a></li>
                    <li><a href="login.html">Login</a></li>
                </ul>
            </nav>
        </section>
    </header>

    <main class="feedback-main">
        <section class="feedback-container">
            <h2>Feedback Form</h2>
            <form>
                <div><label>Name: </label><input type="text" placeholder="Enter your name" required></div>
                <div><label>Email: </label><input type="email" placeholder="Enter your email"></div>
                <div><label>Rating: </label><input type="range" min="1" max="5" step="1"></div>
                <div><label>Comments: </label><textarea placeholder="Enter your comments"></textarea></div>
                <button type="submit">Submit Feedback</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 StudentHub Portal</p>
    </footer>

</body>
</html>
