<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Dashboard of the StudentHub portal">
    <title>Dashboard</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <header class="profile-header">
        <div class="user-logo">
            <img src="logo.png" alt="StudentHub Logo">
        </div>
        <div class="search-info">
            <input type="search" placeholder="Search...">
        </div>
        <div class="user-menu">
            <span class="notification">🔔</span>
            <div class="user-details">
                <p>Prey Patel</p>
                <small>2XDCEXXX</small>
            </div>
            <img src="" class="mini-profile" alt="Profile">
            <span>▼</span>
        </div>
    </header>
    <div class="dashboard-layout">
        <aside class="sidebar">
            <a href="dashboard.html" class="active">🏠 Home</a>
            <a href="profile.html">👤 Profile</a>
            <a href="courses.html">📚 Courses</a>
            <a href="events.html">📅 Events</a>
            <a href="login.html">🚪 Logout</a>
        </aside>
        <main class="dashboard-main">
            <h2>Dashboard</h2>
            <section class="stats">
                <div class="stat-card">
                    <h3>Attendance</h3>
                    <p>92%</p>
                </div>
                <div class="stat-card">
                    <h3>CGPA</h3>
                    <p>8.74</p>
                </div>
            </section>
            <section class="dashboard-card">
                <h3>Today's Timetable</h3>
                <p>9:00 AM - Data Structures</p>
                <p>11:00 AM - Mathematics</p>
            </section>

            <section class="dashboard-card">
                <h3>University Results</h3>
            <p>Semester III Result Published</p>
            </section>
            <section class="dashboard-card">
                <h3>Announcements</h3>
                <p>Hackathon registrations close this Friday.</p>
            </section>
        </main>
    </div>
</body>
</html>
