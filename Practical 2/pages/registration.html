<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Register for the StudentHub Portal">
    <title>Register - StudentHub Portal</title>
    <link rel="stylesheet" href="../../Practical 3/style.css">
</head>
<body>
    <header>
        <section class="top-header">
            <div class="logo">
                <img src="../Student+Hub.jpg" alt="StudentHub Logo">
            </div>
            <div class="title">
                <h1>StudentHub</h1>
            </div>
            <div class="header-controls">
                <button id="themeSwitcher" class="theme-switcher" title="Toggle dark/light mode" onclick="toggleTheme()">🌙</button>
                <button id="hamburgerBtn" class="hamburger" onclick="toggleHamburger()" title="Menu">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
            </div>
        </section>
        <section class="bottom-header">
            <nav><div id="navMenu">
                <ul>
                    <li><a href="home.html">Home</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="events.html">Events</a></li>
                    <li><a href="faq.html">FAQ</a></li>
                    <li><a href="contact.html">Contact</a></li>
                    <li><a href="feedback.html">Feedback</a></li>
                    <li><a class="active" href="registration.html">Register</a></li>
                    <li><a href="login.html">Login</a></li>
                </ul>
            </div></nav>
        </section>
    </header>

    <main class="registration-main">
        <section class="registration-container">
            <h2>StudentHub Portal Registration</h2>
            <form id="registerForm" action="../../Practical 7/process-register.php" method="POST" novalidate>
                <h3>Registration Details</h3>
                
                <div class="form-group">
                    <label for="fullName">Full Name</label>
                    <input type="text" id="fullName" name="fullName" placeholder="e.g. xyz abc" required>
                    <span class="error-message" id="fullNameError"></span>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="e.g. xyz.abc@example.com" required>
                    <span class="error-message" id="emailError"></span>
                </div>

                <div class="form-group">
                    <label for="mobile">Mobile Number</label>
                    <input type="tel" id="mobile" name="mobile" placeholder="10-digit Mobile Number (e.g., 9876543210)" required>
                    <span class="error-message" id="mobileError"></span>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="At least 8 chars, incl. uppercase, lowercase & number" required>
                    <span class="error-message" id="passwordError"></span>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Re-enter Password" required>
                    <span class="error-message" id="confirmPasswordError"></span>
                </div>

                <div class="form-group">
                    <label for="course">Course</label>
                    <select id="course" name="course" required>
                        <option value="">-- Select Course --</option>
                        <option value="Computer Engineering">Computer Engineering</option>
                        <option value="Information Technology">Information Technology</option>
                        <option value="Electronics & Communication">Electronics & Communication</option>
                        <option value="Mechanical Engineering">Mechanical Engineering</option>
                        <option value="Civil Engineering">Civil Engineering</option>
                    </select>
                    <span class="error-message" id="courseError"></span>
                </div>

                <div class="form-group">
                    <label for="year">Year of Study</label>
                    <select id="year" name="year" required>
                        <option value="">-- Select Year --</option>
                        <option value="1st Year">1st Year</option>
                        <option value="2nd Year">2nd Year</option>
                        <option value="3rd Year">3rd Year</option>
                        <option value="4th Year">4th Year</option>
                    </select>
                    <span class="error-message" id="yearError"></span>
                </div>

                <div class="form-group">
                    <label>Gender</label>
                    <div class="gender-options">
                        <label><input type="radio" name="gender" value="Male"> Male</label>
                        <label><input type="radio" name="gender" value="Female"> Female</label>
                        <label><input type="radio" name="gender" value="Other"> Other</label>
                    </div>
                    <span class="error-message" id="genderError"></span>
                </div>

                <div class="form-group terms-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="terms" name="terms" required>
                        I accept the <a href="#" onclick="openModal('Terms & Conditions', 'By checking this box, you agree to abide by the StudentHub Portal code of conduct and usage policies.'); return false;">Terms & Conditions</a>
                    </label>
                    <span class="error-message" id="termsError"></span>
                </div>

                <div class="registration_buttons">
                    <button type="submit">Register</button>
                    <button type="reset">Cancel</button>
                </div>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 StudentHub Portal</p>
    </footer>

    <!-- Notification Banner -->
    <div id="notificationBanner" class="notification-banner">
        <span id="notificationText">Welcome to StudentHub Portal!</span>
        <button class="notification-close" onclick="closeNotification()">&times;</button>
    </div>

    <!-- Modal Popup -->
    <div id="modal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">Modal Title</h3>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body">
                <p id="modalMessage">Modal message content goes here.</p>
            </div>
            <div class="modal-footer">
                <button type="button" onclick="closeModal()">Close</button>
                <button type="button" onclick="confirmModal()" class="btn-primary">Confirm</button>
            </div>
        </div>
    </div>
    <div id="modalOverlay" class="modal-overlay hidden" onclick="closeModal()"></div>

    <!-- JavaScript for Dynamic Components -->
    <script src="../../Practical 4/dynamic-components.js"></script>
    <!-- Practical 7: PHP Form Processing & Validation Bridge -->
    <script src="../../Practical 7/form-handler.js"></script>
</body>
</html>
